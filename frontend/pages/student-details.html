<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - NOTIVA</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f0f9ff; 
            --card-bg: #ffffff;
            --text-main: #0f172a; 
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .split-card {
            display: flex;
            flex-direction: row;
            background-color: var(--card-bg);
            border-radius: 20px; 
            width: 850px;
            max-width: 95%;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .split-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(37, 99, 235, 0.25);
        }

        .card-visual {
            flex: 1;
            background-color: #1e3a8a;
            background-image: 
                linear-gradient(135deg, rgba(30, 58, 138, 0.95), rgba(59, 130, 246, 0.85)),
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-visual h2 {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
        }

        .card-visual h3 {
            font-size: 1.2rem;
            margin: 5px 0 20px 0;
            font-weight: 400;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .card-visual p {
            font-size: 1.05rem;
            line-height: 1.5;
            opacity: 0.85;
            font-style: italic;
            margin-top: 15px;
        }

        .card-form {
            flex: 1;
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-form h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #f8fafc; 
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); 
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        #otherFieldContainer {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="split-card">
        <div class="card-visual">
            <h2>Setup Profile</h2>
            <h3>ON NOTIVA</h3>
            <p>"Turn Notes into Stories,<br>Turn Stories into Learning"</p>
        </div>
        <div class="card-form">
            <h2>Student Details</h2>
            <form id="profileForm">
                <label>Current Level of Study</label>
                <select id="levelSelect" required>
                    <option value="" disabled selected>Select your class or degree</option>
                    <option value="primary">Class 1 to 5 (Primary School)</option>
                    <option value="middle">Class 6 to 8 (Middle School)</option>
                    <option value="high">Class 9 & 10 (High School)</option>
                    <option value="puc">Class 11 & 12 / PUC</option>
                    <option value="undergrad">College (Undergraduate Degree)</option>
                    <option value="postgrad">Postgraduate or Higher</option>
                    <option value="other">Other</option>
                </select>
                
                <div id="otherFieldContainer">
                    <label>Please specify what you are studying</label>
                    <input type="text" id="otherInput" placeholder="e.g., Diploma, Bootcamp, Homeschool">
                </div>
                
                <label>Field, Major, or Board</label>
                <input type="text" id="fieldInput" placeholder="e.g., Your Board, Stream, or Major" required>
                
                <label>Preferred Learning Language</label>
                <select required>
                    <option value="english">English</option>
                    <option value="kannada">Kannada</option>
                    <option value="hindi">Hindi</option>
                </select>

                <button type="submit">Save Profile</button>
            </form>
        </div>
    </div>

    <!-- Dynamic Fields & Connection Script -->
    <script>
        const levelSelect = document.getElementById('levelSelect');
        const otherFieldContainer = document.getElementById('otherFieldContainer');
        const otherInput = document.getElementById('otherInput');
        const fieldInput = document.getElementById('fieldInput');

        levelSelect.addEventListener('change', function() {
            if (this.value === 'other') {
                otherFieldContainer.style.display = 'block';
                otherInput.setAttribute('required', 'true');
            } else {
                otherFieldContainer.style.display = 'none';
                otherInput.removeAttribute('required');
                otherInput.value = ''; 
            }

            switch(this.value) {
                case 'primary':
                case 'middle':
                case 'high':
                    fieldInput.placeholder = "e.g., CBSE, ICSE, State Board";
                    break;
                case 'puc':
                    fieldInput.placeholder = "e.g., PCMB, PCMC, Commerce, Arts";
                    break;
                case 'undergrad':
                case 'postgrad':
                    fieldInput.placeholder = "e.g., Your Degree, Major, or Specialization";
                    break;
                case 'other':
                    fieldInput.placeholder = "e.g., Web Development, Graphic Design";
                    break;
                default:
                    fieldInput.placeholder = "e.g., Your Board, Stream, or Major";
            }
        });

        // Connection to Dashboard
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            window.location.href = 'dashboard.html'; // Go to Main Dashboard
        });
    </script>
</body>
</html>
