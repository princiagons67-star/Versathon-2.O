<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NOTIVA</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="split-card">
        <div class="card-visual">
            <h2>Welcome Back!</h2>
            <h3>TO NOTIVA</h3>
            <p>"Turn Notes into Stories,<br>Turn Stories into Learning"</p>
        </div>
        <div class="card-form">
            <p class="subtitle">Please enter your details to sign in.</p>
            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
                    <a href="#" style="font-size: 0.85rem; color: #2563eb; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>
            </form>
            <div class="auth-links">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- Connection Script -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            window.location.href = 'notes.html'; // Go to Main Dashboard
        });
    </script>
</body>
</html>
