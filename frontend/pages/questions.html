<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Important Questions</title>

    <link rel="stylesheet" href="../css/questions.css">
    <link rel="stylesheet" href="../css/sidebar.css">

</head>

<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside id="sidebar" class="sidebar"></aside>


    <!-- ========================= -->
    <!-- MAIN PAGE -->
    <!-- ========================= -->

    <main class="page with-sidebar">

        <div class="page-title">

            <h1>
                ❓ Important Questions
            </h1>

            <p>
                Questions generated from your study notes.
            </p>

        </div>


        <!-- ========================= -->
        <!-- LOADING -->
        <!-- ========================= -->

        <div
            id="loading"
            class="empty-message">

            Generating questions from your notes...

        </div>


        <!-- ========================= -->
        <!-- NO NOTES -->
        <!-- ========================= -->

        <div
            id="no-notes"
            class="empty-message"
            style="display:none;">

            <h3>
                No study notes found
            </h3>

            <p>
                Please upload or paste your notes first.
            </p>

            <br>

            <a
                href="notes.html"
                class="button">

                Go to Notes

            </a>

        </div>


        <!-- ========================= -->
        <!-- QUESTIONS -->
        <!-- ========================= -->

        <div id="questions-container"></div>


        <!-- ========================= -->
        <!-- SEND TO TEST -->
        <!-- ========================= -->

        <div
            id="test-box"
            class="notes-box"
            style="display:none;">

            <h2>
                Ready for a Test?
            </h2>

            <p>
                Use these questions to test your knowledge.
            </p>

            <br>

            <button
                type="button"
                class="button"
                onclick="sendQuestionsToTest()">

                Send to Test →

            </button>

        </div>

    </main>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="../js/sidebar.js"></script>
    <script src="../js/questions.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
