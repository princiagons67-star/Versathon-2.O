<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests</title>

    <link rel="stylesheet" href="../css/tests.css">
</head>

<body>

    <div class="test-container">

        <h1>Test Your Knowledge</h1>

        <p>Choose your difficulty level</p>

        <div class="difficulty-container">

            <button onclick="selectDifficulty('Easy')">Easy</button>
            <button onclick="selectDifficulty('Medium')">Medium</button>
            <button onclick="selectDifficulty('Hard')">Hard</button>

        </div>

        <p id="selected-level"></p>

        <!-- Question Section -->
        <div class="question-section">

            <h2 id="question">What is the output of 2 + 2?</h2>

            <div class="options">

                <button onclick="selectAnswer('3')">3</button>

                <button onclick="selectAnswer('4')">4</button>

                <button onclick="selectAnswer('5')">5</button>

                <button onclick="selectAnswer('6')">6</button>

            </div>

            <p id="selected-answer"></p>

            <button id="next-button" onclick="nextQuestion()">
                Next Question
            </button>

        </div>

    </div>

    <script src="../js/tests.js"></script>

</body>
</html>
