<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tests</title>

    <link rel="stylesheet" href="../css/tests.css">

</head>

<body>

    <div class="test-container">

        <h1>Test Your Knowledge</h1>


        <!-- ========================= -->
        <!-- LEVEL SELECTION -->
        <!-- ========================= -->

        <div id="level-section">

            <p class="choose-text">
                Choose your level
            </p>

            <div class="difficulty-container">

                <button
                    type="button"
                    onclick="selectDifficulty('Easy')">
                    Easy
                </button>

                <button
                    type="button"
                    onclick="selectDifficulty('Medium')">
                    Medium
                </button>

                <button
                    type="button"
                    onclick="selectDifficulty('Hard')">
                    Hard
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- SELECTED LEVEL -->
        <!-- ========================= -->

        <p id="selected-level"></p>


        <!-- ========================= -->
        <!-- QUESTION COUNT -->
        <!-- ========================= -->

        <div id="question-count-section">

            <p class="choose-text">
                Choose number of questions
            </p>

            <div class="question-count-container">

                <button
                    type="button"
                    onclick="selectQuestionCount(10)">
                    10 Questions
                </button>

                <button
                    type="button"
                    onclick="selectQuestionCount(20)">
                    20 Questions
                </button>

                <button
                    type="button"
                    onclick="selectQuestionCount(30)">
                    30 Questions
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- TEST AREA -->
        <!-- ========================= -->

        <div id="test-area">


            <!-- TIMER -->

            <div id="timer">

                Time Left:

                <span id="time">
                    5:00
                </span>

            </div>


            <!-- QUESTION -->

            <div class="question-section">

                <p id="question-number"></p>

                <h2 id="question">
                    Question will appear here
                </h2>


                <!-- OPTIONS -->

                <div class="options">

                    <button
                        type="button"
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 1
                    </button>

                    <button
                        type="button"
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 2
                    </button>

                    <button
                        type="button"
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 3
                    </button>

                    <button
                        type="button"
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 4
                    </button>

                </div>


                <!-- SELECTED ANSWER -->

                <p id="selected-answer"></p>


                <!-- NEXT / SUBMIT -->

                <div class="test-buttons">

                    <button
                        type="button"
                        id="next-button"
                        onclick="nextQuestion()">
                        Next Question
                    </button>

                    <button
                        type="button"
                        id="submit-button"
                        onclick="submitTest()">
                        Submit Test
                    </button>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- RESULT SECTION -->
        <!-- ========================= -->

        <div id="result-section">

            <h2>
                Test Result
            </h2>


            <p>
                Total Questions:
                <span id="total-questions">
                    0
                </span>
            </p>


            <p>
                Score:
                <span id="score">
                    0 / 0
                </span>
            </p>


            <p>
                Percentage:
                <span id="percentage">
                    0%
                </span>
            </p>


            <p>
                Correct:
                <span id="correct-count">
                    0
                </span>
            </p>


            <p>
                Wrong:
                <span id="wrong-count">
                    0
                </span>
            </p>


            <p>
                Unanswered:
                <span id="unanswered-count">
                    0
                </span>
            </p>


            <!-- MISTAKE NOTEBOOK BUTTON -->

            <button
                type="button"
                id="mistake-button"
                onclick="showMistakeNotebook()">
                View Mistake Notebook
            </button>


            <!-- START ANOTHER TEST BUTTON -->

            <button
                type="button"
                id="start-another-button"
                onclick="startAnotherTest()">
                Start Another Test
            </button>

        </div>


        <!-- ========================= -->
<!-- MISTAKE NOTEBOOK -->
<!-- ========================= -->

<div id="mistake-section">

    <h2> Mistake Notebook </h2>

    <div id="mistake-list">
        <!-- Mistakes will appear here -->
    </div>

    <!-- RETRY MISTAKES BUTTON -->
    <button
        type="button"
        id="retry-mistakes-button"
        onclick="retryMistakes()">
        Retry Mistakes
    </button>

    <!-- BACK TO RESULT BUTTON -->
    <button
        type="button"
        id="back-result-button"
        onclick="hideMistakeNotebook()">
        Back to Result
    </button>

</div>
<div class=""></div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/tests.js"></script>

</body>

</html>
