<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tests</title>

    <link rel="stylesheet" href="../css/tests.css">
</head>

<body>

    <div class="test-container">

        <h1>Test Your Knowledge</h1>

        <!-- Difficulty Selection -->
        <div id="level-section">

            <p class="choose-text">Choose your level</p>

            <div class="difficulty-container">

                <button onclick="selectDifficulty('Easy')">
                    Easy
                </button>

                <button onclick="selectDifficulty('Medium')">
                    Medium
                </button>

                <button onclick="selectDifficulty('Hard')">
                    Hard
                </button>

            </div>

        </div>


        <!-- Question Count Selection -->
        <div id="question-count-section">

            <p class="choose-text">
                Choose number of questions
            </p>

            <div class="question-count-container">

                <button onclick="selectQuestionCount(10)">
                    10 Questions
                </button>

                <button onclick="selectQuestionCount(20)">
                    20 Questions
                </button>

                <button onclick="selectQuestionCount(30)">
                    30 Questions
                </button>

            </div>

        </div>


        <!-- Selected Level -->
        <p id="selected-level"></p>


        <!-- Test Area -->
        <div id="test-area">

            <!-- Timer -->
            <div id="timer">

                Time Left:
                <span id="time">5:00</span>

            </div>


            <!-- Question -->
            <div class="question-section">

                <p id="question-number"></p>

                <h2 id="question">
                    Question will appear here
                </h2>


                <!-- Options -->
                <div class="options">

                    <button
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 1
                    </button>

                    <button
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 2
                    </button>

                    <button
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 3
                    </button>

                    <button
                        class="option-button"
                        onclick="selectAnswer(this)">
                        Option 4
                    </button>

                </div>


                <!-- Selected Answer -->
                <p id="selected-answer"></p>


                <!-- Buttons -->
                <div class="test-buttons">

                    <button
                        id="next-button"
                        onclick="nextQuestion()">
                        Next Question
                    </button>

                    <button
                        id="submit-button"
                        onclick="submitTest()">
                        Submit Test
                    </button>

                </div>

            </div>

        </div>


        <!-- Result Section -->
        <div id="result-section">

            <h2>Test Result</h2>

            <p>
                Score:
                <span id="score">0</span>
            </p>

            <p>
                Correct:
                <span id="correct-count">0</span>
            </p>

            <p>
                Wrong:
                <span id="wrong-count">0</span>
            </p>

            <p>
                Unanswered:
                <span id="unanswered-count">0</span>
            </p>


            <button
                id="start-another-button"
                onclick="startAnotherTest()">
                Start Another Test
            </button>

        </div>
        <button
            id="mistake-button"
            onclick="showMistakeNotebook()">
            View Mistake Notebook
        </button>

    </div>
    <div id="mistake-section">

    <h2>Mistake Notebook</h2>

    <div id="mistake-list"></div>

    <button
        id="back-result-button"
        onclick="hideMistakeNotebook()">
        Back to Result
    </button>

</div>


    <script src="../js/tests.js"></script>

</body>

</html>
